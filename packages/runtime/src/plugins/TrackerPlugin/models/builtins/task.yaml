type: task
displayName: Task
displayNamePlural: Tasks
icon: task_alt
color: "#2563eb"

modes:
  inline: true
  fullDocument: false

sharing: team
draftByDefault: false

idPrefix: tsk
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  - name: status
    type: select
    default: to-do
    options:
      - value: to-do
        label: To Do
        icon: circle
        category: unstarted
      - value: in-progress
        label: In Progress
        icon: motion_photos_on
        category: started
      - value: in-review
        label: In Review
        icon: rate_review
        color: "#3b82f6"
        category: started
      - value: changes-requested
        label: Changes Requested
        icon: edit_note
        color: "#f97316"
        category: started
      - value: approved
        label: Approved
        icon: verified
        color: "#22c55e"
        category: started
      - value: done
        label: Done
        icon: check_circle
        category: done
      - value: wont-do
        label: Won't Do
        icon: do_not_disturb_on
        color: "#64748b"
        category: cancelled
      - value: duplicate
        label: Duplicate
        icon: content_copy
        color: "#64748b"
        category: cancelled

  - name: priority
    type: select
    default: medium
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
      - value: critical
        label: Critical

  - name: owner
    type: user

  - name: description
    type: text

  - name: scheduledDate
    type: date

  - name: dueDate
    type: date

  # Subtasks are ordinary tasks with an independent workflow and optional session.
  - name: parentTask
    type: relationship
    relationshipTypeKey: child-of
    inverseRelationshipTypeKey: parent-of
    inverseFieldId: subtasks
    targetTrackerTypes:
      - task
    multiValue: false

  - name: subtasks
    type: relationship
    relationshipTypeKey: parent-of
    inverseRelationshipTypeKey: child-of
    inverseFieldId: parentTask
    targetTrackerTypes:
      - task
    multiValue: true

  # Dependency pair. `dependsOn` records work this item waits on; `blocks` records
  # work waiting on this item. Writing either side materializes the other.
  - name: dependsOn
    type: relationship
    relationshipTypeKey: depends-on
    inverseRelationshipTypeKey: blocks
    inverseFieldId: blocks
    targetTrackerTypes: "*"
    multiValue: true

  - name: blocks
    type: relationship
    relationshipTypeKey: blocks
    inverseRelationshipTypeKey: depends-on
    inverseFieldId: dependsOn
    targetTrackerTypes: "*"
    multiValue: true

  # Collection membership. Written directly, or by inverse propagation when an
  # item is added to a milestone/release from the collection side.
  - name: collection
    type: relationship
    relationshipTypeKey: in-collection
    inverseRelationshipTypeKey: has-item
    inverseFieldId: items
    targetTrackerTypes:
      - milestone
      - release
    multiValue: true

  # Goal membership. Written directly, or by inverse propagation when an item
  # is added from a goal's `contributes` field.
  - name: goal
    type: relationship
    relationshipTypeKey: contributed-by
    inverseRelationshipTypeKey: contributes-to
    inverseFieldId: contributes
    targetTrackerTypes:
      - goal
    multiValue: true

  - name: tags
    type: array
    itemType: string
    displayInline: false

inlineTemplate: "{icon} {title} {status} {owner}"

roles:
  title: title
  workflowStatus: status
  priority: priority
  assignee: owner
  tags: tags
  dueDate: dueDate
